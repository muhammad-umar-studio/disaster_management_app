name: disaster_management_app
description: "ResQ AI - Crisis Intelligence & Disaster Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  go_router: ^14.6.3
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0

  # Maps & Places
  google_maps_flutter: ^2.9.0

  # Gemini AI
  google_generative_ai: ^0.4.6

  # HTTP requests
  http: ^1.2.2

  # Location / GPS
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # URL Launcher (phone dialing, maps, web)
  url_launcher: ^6.3.1

  # Supabase (auth + database)
  supabase_flutter: ^2.8.4

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Unique IDs
  uuid: ^4.5.1

  # Flashlight / Torch control
  torch_light: ^1.1.0

  # Share content (location sharing)
  share_plus: ^10.1.4

  # Voice / Speech recognition
  speech_to_text: ^7.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
